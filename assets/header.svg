<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Angora Yao Magloire — Software Developer from Abidjan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a78bfa;#f472b6;#22d3ee" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#f472b6;#22d3ee;#a78bfa" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="frame"><rect width="1000" height="260" rx="18"/></clipPath>
    <style>
      .blob { animation: float 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .b2 { animation-duration: 15s; animation-direction: reverse; }
      .b3 { animation-duration: 18s; }
      @keyframes float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(60px, -30px) scale(1.15); }
        66% { transform: translate(-40px, 25px) scale(0.9); }
      }
      .hi { font: 600 22px 'Segoe UI', Ubuntu, sans-serif; fill: #cbd5e1; opacity: 0; animation: up .8s ease-out .2s forwards; }
      .name { font: 800 54px 'Segoe UI', Ubuntu, sans-serif; fill: url(#txt); opacity: 0; animation: up .9s ease-out .5s forwards; }
      .role { font: 500 22px 'Segoe UI', Ubuntu, sans-serif; fill: #94a3b8; opacity: 0; animation: up .9s ease-out .9s forwards; }
      @keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      .wave { animation: drift 10s linear infinite; }
      .wave2 { animation-duration: 16s; opacity: .5; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1000px); } }
      .hand { transform-box: fill-box; transform-origin: 70% 80%; animation: wave 2.4s ease-in-out 1.2s infinite; }
      @keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(14deg); } 20%, 40% { transform: rotate(-8deg); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity=".55">
      <circle class="blob" cx="180" cy="80" r="110" fill="#22d3ee"/>
      <circle class="blob b2" cx="820" cy="70" r="120" fill="#a78bfa"/>
      <circle class="blob b3" cx="560" cy="230" r="100" fill="#f472b6"/>
    </g>
    <text class="hi" x="500" y="78" text-anchor="middle">Hello, I'm <tspan class="hand">👋</tspan></text>
    <text class="name" x="500" y="140" text-anchor="middle">Angora Yao Magloire</text>
    <text class="role" x="500" y="180" text-anchor="middle">Software Developer · Abidjan, Côte d'Ivoire 🇨🇮</text>
    <g class="wave">
      <path d="M0 232 Q125 212 250 232 T500 232 T750 232 T1000 232 T1250 232 T1500 232 T1750 232 T2000 232 V260 H0 Z" fill="#22d3ee" opacity=".25"/>
    </g>
    <g class="wave wave2">
      <path d="M0 240 Q125 256 250 240 T500 240 T750 240 T1000 240 T1250 240 T1500 240 T1750 240 T2000 240 V260 H0 Z" fill="#a78bfa"/>
    </g>
  </g>
</svg>
